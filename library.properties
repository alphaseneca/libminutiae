sentence=Lightweight, MCU-grade C++ biometric fingerprint identification and ISO/ANSI standardization library.
paragraph=libminutiae is an ultra-lightweight, dependency-free C++17 biometric fingerprint engine designed for embedded microcontrollers (ESP32, STM32, Atmel SAMD/AVR) and desktop systems alike. It provides NIST NFIQ 2 quality assessment, Zhang-Suen morphological thinning, Rutovitz Crossing Number minutiae extraction, and ISO/IEC 19794-2 (2005 & 2011) / ANSI INCITS 378 (2004 & 2009) standard template serialization, with modular hardware sensor driver encapsulation.
